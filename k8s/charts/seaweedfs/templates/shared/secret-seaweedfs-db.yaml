{{- if and .Values.filer.enabled (include "seaweedfs.filer.mysqlEnabled" .) }}
{{- /* Kept on uninstall, but the pre-install hook recreates it on the next install:
       reuse the stored user and password so the filer can still log in. */}}
{{- $existing := lookup "v1" "Secret" (include "seaweedfs.namespace" .) (printf "%s-db-secret" (include "seaweedfs.fullname" .)) }}
{{- $data := ($existing | default dict).data | default dict }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "seaweedfs.fullname" . }}-db-secret
  namespace: {{ include "seaweedfs.namespace" . | quote }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
  labels:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
stringData:
  user: {{ if $data.user }}{{ b64dec $data.user | quote }}{{ else }}"YourSWUser"{{ end }}
  # generated on first install, reused afterwards
  password: {{ if $data.password }}{{ b64dec $data.password | quote }}{{ else }}{{ randAlphaNum 10 | sha256sum | b64enc | trunc 32 }}{{ end }}
{{- end }}
