{{- include "seaweedfs.compat" . -}}
{{- if include "seaweedfs.securityConfigEnabled" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seaweedfs.fullname" . }}-security-config
  namespace: {{ include "seaweedfs.namespace" . | quote }}
  labels:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with include "seaweedfs.commonLabels" $ }}{{ . | nindent 4 }}{{ end }}
type: Opaque
stringData:
  {{- $fullname := include "seaweedfs.fullname" . }}
  {{- $securityConfigName := printf "%s-security-config" $fullname }}
  {{- $existing := lookup "v1" "ConfigMap" (include "seaweedfs.namespace" .) $securityConfigName }}
  {{- if not $existing }}
  {{- $legacyName := printf "%s-%s" (include "seaweedfs.name" .) "security-config" }}
  {{- $existing = lookup "v1" "ConfigMap" (include "seaweedfs.namespace" .) $legacyName }}
  {{- end }}
  {{- $ownConfigMap := eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) .Release.Name }}
  {{- if and $ownConfigMap (or (and .Values.master.enabled (gt (int .Values.master.updatePartition) 0)) (and .Values.filer.enabled (gt (int .Values.filer.updatePartition) 0))) }}
  {{- fail "this upgrade moves security.toml from a ConfigMap to a Secret and removes the ConfigMap; run it with master.updatePartition=0 and filer.updatePartition=0 so no pod is left on the old template" }}
  {{- end }}
  {{- $existingToml := dig "data" "security.toml" "" (lookup "v1" "Secret" (include "seaweedfs.namespace" .) $securityConfigName) | b64dec | default (dig "data" "security.toml" "" $existing) }}
  {{- $securityConfigValues := .Values.global.seaweedfs.securityConfig | default dict }}
  {{- $jwtSigning := $securityConfigValues.jwtSigning | default dict }}
  {{- $expiresAfterSeconds := $jwtSigning.expiresAfterSeconds | default dict }}
  security.toml: |-
    # this file is read by master, volume server, and filer

    {{- if $jwtSigning.volumeWrite }}
    # the jwt signing key is read by master and volume server
    # the jwt defaults to expire after 10 seconds
    [jwt.signing]
    key = {{ include "seaweedfs.existingTomlKey" (list "jwt.signing" $existingToml) | default (randAlphaNum 64 | quote) }}
    {{- if gt (int $expiresAfterSeconds.volumeWrite) 0 }}
    expires_after_seconds = {{ int $expiresAfterSeconds.volumeWrite }}
    {{- end }}
    {{- end }}

    {{- if $jwtSigning.volumeRead }}
    # this jwt signing key is read by master and volume server, and it is used for read operations:
    # - the Master server generates the JWT, which can be used to read a certain file on a volume server
    # - the Volume server validates the JWT on reading
    # the jwt defaults to expire after 60 seconds
    [jwt.signing.read]
    key = {{ include "seaweedfs.existingTomlKey" (list "jwt.signing.read" $existingToml) | default (randAlphaNum 64 | quote) }}
    {{- if gt (int $expiresAfterSeconds.volumeRead) 0 }}
    expires_after_seconds = {{ int $expiresAfterSeconds.volumeRead }}
    {{- end }}
    {{- end }}

    {{- if $jwtSigning.filerWrite }}
    # If this JWT key is configured, Filer only accepts writes over HTTP if they are signed with this JWT:
    # - f.e. the S3 API Shim generates the JWT
    # - the Filer server validates the JWT on writing
    # the jwt defaults to expire after 10 seconds
    [jwt.filer_signing]
    key = {{ include "seaweedfs.existingTomlKey" (list "jwt.filer_signing" $existingToml) | default (randAlphaNum 64 | quote) }}
    {{- if gt (int $expiresAfterSeconds.filerWrite) 0 }}
    expires_after_seconds = {{ int $expiresAfterSeconds.filerWrite }}
    {{- end }}
    {{- end }}

    {{- if $jwtSigning.filerRead }}
    # If this JWT key is configured, Filer only accepts reads over HTTP if they are signed with this JWT:
    # - f.e. the S3 API Shim generates the JWT
    # - the Filer server validates the JWT on reading
    # the jwt defaults to expire after 60 seconds
    [jwt.filer_signing.read]
    key = {{ include "seaweedfs.existingTomlKey" (list "jwt.filer_signing.read" $existingToml) | default (randAlphaNum 64 | quote) }}
    {{- if gt (int $expiresAfterSeconds.filerRead) 0 }}
    expires_after_seconds = {{ int $expiresAfterSeconds.filerRead }}
    {{- end }}
    {{- end }}

    {{- if .Values.global.seaweedfs.enableSecurity }}
    # all grpc tls authentications are mutual
    # the values for the following ca, cert, and key are paths to the PERM files.
    [grpc]
    ca = "/usr/local/share/ca-certificates/ca/tls.crt"

    [grpc.volume]
    cert = "/usr/local/share/ca-certificates/volume/tls.crt"
    key  = "/usr/local/share/ca-certificates/volume/tls.key"

    [grpc.master]
    cert = "/usr/local/share/ca-certificates/master/tls.crt"
    key  = "/usr/local/share/ca-certificates/master/tls.key"

    [grpc.filer]
    cert = "/usr/local/share/ca-certificates/filer/tls.crt"
    key  = "/usr/local/share/ca-certificates/filer/tls.key"

    [grpc.admin]
    cert = "/usr/local/share/ca-certificates/admin/tls.crt"
    key  = "/usr/local/share/ca-certificates/admin/tls.key"

    [grpc.vector]
    cert = "/usr/local/share/ca-certificates/vector/tls.crt"
    key  = "/usr/local/share/ca-certificates/vector/tls.key"

    [grpc.worker]
    cert = "/usr/local/share/ca-certificates/worker/tls.crt"
    key  = "/usr/local/share/ca-certificates/worker/tls.key"

    {{- /* S3 gRPC server identity (weed s3 -port.grpc, default httpPort+10000).
      Without this section, LoadServerTLS("grpc.s3") returns nil and the S3
      server serves its internal gRPC (IAM cache propagation, s3 lifecycle
      delete RPCs) as plaintext, while peers dial it with mTLS credentials:
      "tls: first record does not look like a TLS handshake".
      Always uses the internal CA-signed client certificate (already mounted
      on s3 pods by s3-deployment.yaml). Deliberately NOT s3.tlsSecret: that
      secret is for the public HTTPS listener and may be issued by a public
      CA which internal gRPC peers (trusting only grpc.ca) would reject. */}}
    [grpc.s3]
    cert = "/usr/local/share/ca-certificates/client/tls.crt"
    key  = "/usr/local/share/ca-certificates/client/tls.key"

    # use this for any place needs a grpc client
    # i.e., "weed backup|benchmark|filer.copy|filer.replicate|mount|s3|upload"
    [grpc.client]
    cert = "/usr/local/share/ca-certificates/client/tls.crt"
    key  = "/usr/local/share/ca-certificates/client/tls.key"

    {{- if include "seaweedfs.volumeHttps" . }}

    [https.client]
    enabled = true
    cert = "/usr/local/share/ca-certificates/client/tls.crt"
    key  = "/usr/local/share/ca-certificates/client/tls.key"
    ca   = "/usr/local/share/ca-certificates/ca/tls.crt"

    [https.volume]
    cert = "/usr/local/share/ca-certificates/volume/tls.crt"
    key  = "/usr/local/share/ca-certificates/volume/tls.key"
    {{- else }}

    # volume server https: set global.seaweedfs.volumeHttps.enabled
    [https.client]
    enabled = false
    [https.volume]
    cert = ""
    key  = ""
    {{- end }}
    {{- end }}
{{- end }}
