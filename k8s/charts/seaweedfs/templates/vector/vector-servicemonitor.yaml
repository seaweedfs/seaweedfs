{{- if and .Values.vector.enabled .Values.vector.metricsPort .Values.global.seaweedfs.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "seaweedfs.componentName" (list . "vector") }}
  namespace: {{ include "seaweedfs.namespace" . | quote }}
  labels:
    {{- include "seaweedfs.vector.labels" . | nindent 4 }}
    {{- with .Values.global.seaweedfs.monitoring.additionalLabels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with .Values.vector.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 5s
  selector:
    matchLabels:
      {{- include "seaweedfs.vector.selectorLabels" . | nindent 6 }}
{{- end }}
