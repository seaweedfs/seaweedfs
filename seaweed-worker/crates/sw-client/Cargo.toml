[package]
name = "sw-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SeaweedFS client library: filer gRPC metadata plane + volume HTTP data plane"

[lib]
name = "sw_client"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes = "1"
log = "0.4"
prost.workspace = true
# System roots for volume servers behind public CAs, as Go's http client.
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored = "3"

[lints]
workspace = true
