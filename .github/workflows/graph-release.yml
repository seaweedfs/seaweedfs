name: Graph release asset

# Attaches a code knowledge graph bundle to a published GitHub release.
# Code-only mode needs no API key; see graph.yml for the scheduled build.
#
# A release created with the default GITHUB_TOKEN does not trigger this
# workflow; run it by hand with the tag in that case.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the graph bundle to"
        required: true
        type: string

permissions:
  contents: write

env:
  GRAPHIFY_VERSION: "0.9.112"
  PYTHONHASHSEED: "0"
  GRAPHIFY_NO_BACKUP: "1"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  graph:
    name: Attach graph bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install graphify
        run: python -m pip install "graphifyy==${GRAPHIFY_VERSION}"

      # Start from the default branch's graph so only files changed since the
      # last scheduled run are re-extracted. Restore only: release runs never
      # write to the cache.
      - name: Restore graph state
        uses: actions/cache/restore@v6
        with:
          path: |
            graphify-out
            !graphify-out/20*
          key: graphify-${{ runner.os }}-${{ github.event.repository.default_branch }}-${{ github.sha }}
          restore-keys: |
            graphify-${{ runner.os }}-${{ github.event.repository.default_branch }}-

      - name: Build the code graph
        run: |
          if [ -f graphify-out/graph.json ]; then
            graphify update .
          else
            graphify extract . --code-only --no-cluster
            graphify cluster-only .
          fi

      - name: Bundle outputs
        run: |
          gzip -9 -c graphify-out/graph.json > graph.json.gz
          files=(graph.json.gz graphify-out/GRAPH_REPORT.md)
          if [ -f graphify-out/graph.html ]; then
            files+=(graphify-out/graph.html)
          else
            echo "::warning::graphify-out/graph.html was not generated"
          fi
          tar -czf "graph-${TAG}.tar.gz" "${files[@]}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" "graph-${TAG}.tar.gz" --clobber --repo "${GITHUB_REPOSITORY}"
