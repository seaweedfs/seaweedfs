          pip install pyyaml -q
          python3 - /tmp/security-s3.yaml /tmp/security-aio.yaml <<'PYEOF'
          import yaml, sys
          errors = []
          for path in sys.argv[1:]:
              with open(path) as f:
                  docs = list(yaml.safe_load_all(f))
              for doc in docs:
                  if not doc or doc.get("kind") not in ("Deployment", "StatefulSet"):
