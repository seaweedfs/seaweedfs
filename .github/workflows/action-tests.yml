name: "actions: unit tests"

on:
  push:
    branches: [ master ]
    paths:
      - '.github/actions/**'
      - '.github/workflows/action-tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/actions/**'
      - '.github/workflows/action-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  cleanup-stale-fuse-mounts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run cleanup action unit tests
        run: python3 .github/actions/cleanup-stale-fuse-mounts/test_cleanup.py
