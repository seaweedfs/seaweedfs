name: "Plugin Worker Integration Tests"

on:
  push:
    branches: [ master ]
    paths:
      - 'weed/**'
      - 'test/plugin_workers/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/plugin-workers.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'weed/**'
      - 'test/plugin_workers/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/plugin-workers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  plugin-worker:
    name: "Plugin Worker: ${{ matrix.worker }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: erasure_coding
            path: test/plugin_workers/erasure_coding
          - worker: vacuum
            path: test/plugin_workers/vacuum
          - worker: volume_balance
            path: test/plugin_workers/volume_balance

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
          go-version: ^1.26
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Run plugin worker tests
        run: go test -v ./${{ matrix.path }}
