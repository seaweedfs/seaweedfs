name: "S3 listing study tests"

on:
  push:
    branches: [ master ]
    paths:
      - 'weed/s3api/**'
      - 'weed/filer/**'
      - 'weed/server/**'
      - 'test/s3/listing_study/**'
      - '.github/workflows/s3-listing-study-tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'weed/s3api/**'
      - 'weed/filer/**'
      - 'weed/server/**'
      - 'test/s3/listing_study/**'
      - '.github/workflows/s3-listing-study-tests.yml'

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}/s3-listing-study-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  listing-study:
    name: s3-listing-study tools and strategies
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: test/s3/listing_study
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Cache pinned listing tools
        uses: actions/cache@v6
        with:
          path: test/s3/listing_study/.work/tools
          key: listing-study-tools-${{ runner.os }}-${{ hashFiles('test/s3/listing_study/Makefile', 'test/s3/listing_study/install_tools.py') }}

      - name: Build weed and install the study's pinned tools
        run: make build-weed tools

      - name: Run the listing study against SeaweedFS
        timeout-minutes: 15
        run: make test

      - name: Show logs on failure
        if: failure()
        run: |
          tail -200 .work/weed.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3-listing-study-results
          path: |
            test/s3/listing_study/.work/run/results.json
            test/s3/listing_study/.work/weed.log
          retention-days: 14
