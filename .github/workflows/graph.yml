name: Graph

# Builds a code knowledge graph with the open-source Graphify CLI and uploads
# it as an artifact. Code-only mode parses the repository with tree-sitter and
# needs no API key or secret.
#
# The graph is not committed: graph.json is ~150 MiB, above GitHub's 100 MiB
# file limit. Release assets are produced by graph-release.yml, which restores
# the cache saved here.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRAPHIFY_VERSION: "0.9.112"
  # Stable community ids across runs.
  PYTHONHASHSEED: "0"
  # Without this, graphify snapshots the whole graph into graphify-out/<date>/
  # before every overwrite and never prunes it, so the cache would grow daily.
  GRAPHIFY_NO_BACKUP: "1"

jobs:
  graph:
    name: Build code graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install graphify
        run: python -m pip install "graphifyy==${GRAPHIFY_VERSION}"

      - name: Restore graph state
        uses: actions/cache@v6
        with:
          path: |
            graphify-out
            !graphify-out/20*
          key: graphify-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            graphify-${{ runner.os }}-${{ github.ref_name }}-
            graphify-${{ runner.os }}-

      - name: Build or update the graph
        run: |
          if [ -f graphify-out/graph.json ]; then
            graphify update .
          else
            # Cluster once: extract alone does not write the report or HTML.
            # cluster-only names communities after their hub nodes; no LLM is
            # called without a configured backend.
            graphify extract . --code-only --no-cluster
            graphify cluster-only .
          fi

      - name: Graph health
        run: |
          graphify diagnose multigraph --json > graph-health.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          summary = json.load(open("graph-health.json")).get("summary", {})
          print("### Graph health")
          print(f"- nodes: {summary.get('node_count', 'n/a')}")
          print(f"- edges: {summary.get('raw_edge_count', 'n/a')}")
          print(f"- dangling endpoints: {summary.get('dangling_endpoint_edges', 'n/a')}")
          print(f"- duplicate edges: {summary.get('exact_duplicate_edges', 'n/a')}")
          PY

      - name: Bundle outputs
        run: |
          gzip -9 -c graphify-out/graph.json > graph.json.gz
          files=(graph.json.gz graphify-out/GRAPH_REPORT.md graph-health.json)
          # graphify skips graph.html when it cannot aggregate a large graph.
          if [ -f graphify-out/graph.html ]; then
            files+=(graphify-out/graph.html)
          else
            echo "::warning::graphify-out/graph.html was not generated"
          fi
          tar -czf graph-bundle.tar.gz "${files[@]}"

      - name: Upload graph artifact
        uses: actions/upload-artifact@v7
        with:
          name: graph-${{ github.sha }}
          path: graph-bundle.tar.gz
          retention-days: 14
