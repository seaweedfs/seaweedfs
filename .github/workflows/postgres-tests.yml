name: "PostgreSQL Gateway Tests"

on:
  push:
    branches: [ master ]
    paths:
      - 'weed/server/postgres/**'
      - 'weed/query/**'
      - 'weed/mq/**'
      - 'test/postgres/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/postgres-tests.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'weed/server/postgres/**'
      - 'weed/query/**'
      - 'weed/mq/**'
      - 'test/postgres/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/postgres-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  postgres-basic-tests:
    name: PostgreSQL Basic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test/postgres
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        cache: ${{ runner.environment == 'github-hosted' }}
        go-version: ^1.26
      id: go

    - name: Check out code
      uses: actions/checkout@v7

    - name: Configure Docker Hub mirror
      run: |
        echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-postgres-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-postgres-

    - name: Start PostgreSQL Gateway Services
      run: |
        make dev-start
        sleep 10

    - name: Run Basic Connectivity Test
      run: |
        make test-basic

    - name: Run PostgreSQL Client Tests
      run: |
        make test-client

    - name: Save logs
      if: always()
      run: |
        docker compose logs > postgres-output.log || true

    - name: Archive logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: postgres-logs
        path: test/postgres/postgres-output.log

    - name: Cleanup
      if: always()
      run: |
        make clean || true
