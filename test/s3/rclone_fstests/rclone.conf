# rclone remote used by the Makefile. The endpoint comes from
# RCLONE_CONFIG_SWFS_ENDPOINT so it follows S3_PORT.
#
# use_already_exists stays at the SeaweedFS provider default (false): with it
# set, the ObjectLock tests fail on rclone's own CreateBucket for a bucket the
# test already created with Object Lock, which SeaweedFS answers with
# BucketAlreadyExists. See Internal/Versions/Mkdir in expected_failures.txt.
[swfs]
type = s3
provider = SeaweedFS
access_key_id = admin
secret_access_key = admin
force_path_style = true
