[package]
name = "weed-vector-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VectorService gRPC server over SeaweedFS Lance table buckets"

[lib]
name = "weed_vector_server"

[[bin]]
name = "weed-vector"
path = "src/main.rs"

[dependencies]
weed-vector-core = { path = "../core" }
weed-lance-worker = { path = "../../../seaweed-worker/crates/lance" }
lance = { version = "10", default-features = false, features = ["aws"] }
lance-arrow = "10"
lance-linalg = "10"
arrow-array = "58"
arrow-cast = "58"
arrow-schema = "58"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
