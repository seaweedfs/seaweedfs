global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'prometheus:9090'
          - 'master:9324'
          - 'volume:9325'
          - 'filer:9326'
          - 's3:9327'
          # A plugin worker publishes its own metrics when started with
          # -metricsPort (Go) or --metrics-port (Rust). 9328 continues the
          # series, since 9327 is already the S3 gateway's.
          # - 'worker:9328'
